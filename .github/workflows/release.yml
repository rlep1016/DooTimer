name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore DooTimer.csproj
      working-directory: DooTimer-cs

    - name: Publish
      run: dotnet publish DooTimer.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -o publish
      working-directory: DooTimer-cs

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: DooTimer-cs/publish/DooTimer.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
