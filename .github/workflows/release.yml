name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish
      run: dotnet publish DooTimer.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -o publish
      working-directory: DooTimer-cs

    - name: Install Inno Setup
      run: |
        curl -L -o innosetup.exe "https://files.jrsoftware.org/is/6/innosetup-6.4.1.exe"
        .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="C:\inno"
      shell: powershell

    - name: Build Installer
      run: |
        $iscc = "C:\inno\ISCC.exe"
        & $iscc setup.iss
      working-directory: DooTimer-cs

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: DooTimer-cs/installer/DooTimer-Setup-*.exe
