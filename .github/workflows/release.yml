name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish
      run: dotnet publish DooTimer.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -o publish
      working-directory: DooTimer-cs

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress
      working-directory: DooTimer-cs

    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
      working-directory: DooTimer-cs

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          DooTimer-cs/publish/DooTimer.exe
          DooTimer-cs/installer/DooTimer-Setup-*.exe
